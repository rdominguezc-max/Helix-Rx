services:
  postgres:
    image: postgres:17-alpine
    container_name: helix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix_dev_password
      POSTGRES_DB: helix_dev
    ports:
      - "5432:5432"
    volumes:
      - helix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    container_name: helix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_NAME: helix
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: helix
      DATABASE_PASSWORD: helix_dev_password
      DATABASE_NAME: helix_dev
      DATABASE_SSL: "false"
      FIREBASE_PROJECT_ID: ""
      FIREBASE_CLIENT_EMAIL: ""
      FIREBASE_PRIVATE_KEY: ""
    ports:
      - "3000:3000"
    command: ["sh", "-c", "pnpm migrate && pnpm start:dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  helix-postgres-data:
